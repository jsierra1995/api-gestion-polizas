spring:
  application:
    name: api-gestion-polizas
  datasource:
    url: jdbc:h2:mem:polizasdb
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true

app:
  # IPC anual que se aplica al renovar (0.05 = 5 %). Valor de ejemplo: el real lo publica el DANE.
  ipc: 0.05
